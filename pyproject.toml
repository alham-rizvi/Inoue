[project]
name = "inoue"
version = "2.1.0"
description = "Inoue — fast tech stack fingerprinting CLI"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{name = "Alham Rizvi"}]
requires-python = ">=3.10"
dependencies = [
	"httpx>=0.27",
	"rich>=13",
	"typer>=0.12",
	"dnspython>=2.6",
	"python-whois>=0.8",
	"requests>=2.31",
	"beautifulsoup4>=4.12",
	"sslyze>=6.0.0",
	# Recon modules under core/: registrable-domain parsing (cloud_buckets,
	# sri, dns_deep), hardened XML parsing so untrusted sitemaps and
	# crossdomain.xml cannot trigger XXE/billion-laughs (exposure), and HTTP/2
	# support so httpx can negotiate h2 (http_protocol). Opt-in active tooling
	# lives in the `recon` extra below.
	"tldextract>=5.1",
	"defusedxml>=0.7",
	"h2>=4.1",
	"tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
api = [
	"fastapi>=0.111",
	"uvicorn>=0.30",
]
mcp = [
	# mcp_server.py supports both the v1 (FastMCP) and v2 (MCPServer) SDK
	# APIs directly, so no upper/lower pin is needed beyond 1.0.
	"mcp>=1.0",
]
hashing = [
	"mmh3>=4.0",
]
recon = [
	# Opt-in recon tooling. Each is imported behind a try/except ImportError in
	# the module it serves, so the core install works without them:
	#   wafw00f -> active WAF fingerprinting (`from wafw00f.main import WAFW00F`)
	#   pydnsbl -> extra DNS blocklist sources for core/reputation.py
	#   pyasn   -> optional offline ASN cross-check for core/asn_intel.py
	"wafw00f>=2.4",
	"pydnsbl>=1.1",
	"pyasn>=1.6",
]

[project.scripts]
inoue = "inoue:app"
inoue-mcp = "mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["inoue", "mcp_server"]

[tool.setuptools.packages.find]
include = ["core*", "fingerprints*", "api*", "data*"]

[tool.setuptools.package-data]
data = ["cves.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
