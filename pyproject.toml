[project]
name = "inoue"
version = "1.1.0"
description = "Inoue — fast tech stack fingerprinting CLI"
authors = [{name = "Alham Rizvi"}]
requires-python = ">=3.10"
dependencies = [
	"httpx>=0.27",
	"rich>=13",
	"typer>=0.12",
	"dnspython>=2.6",
	"python-whois>=0.8",
	"requests>=2.31",
	"beautifulsoup4>=4.12",
]

[project.scripts]
inoue = "inoue:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["inoue"]

[tool.setuptools.packages.find]
include = ["core*", "fingerprints*"]

[tool.poetry.dependencies]
httpx = ">=0.27"
rich = ">=13"
typer = ">=0.12"
dnspython = ">=2.6"
python-whois = ">=0.8"
requests = ">=2.31"
beautifulsoup4 = ">=4.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
