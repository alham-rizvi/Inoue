[project]
name = "inoue"
version = "1.1.2"
description = "Inoue — fast tech stack fingerprinting CLI"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{name = "Alham Rizvi"}]
requires-python = ">=3.10"
dependencies = [
	"httpx>=0.27",
	"rich>=13",
	"typer>=0.12",
	"dnspython>=2.6",
	"python-whois>=0.8",
	"requests>=2.31",
	"beautifulsoup4>=4.12",
	"sslyze>=6.0.0",
	"python-nmap>=0.7.1",
	"tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
api = [
	"fastapi>=0.111",
	"uvicorn>=0.30",
]
mcp = [
	"mcp>=1.0",
]
hashing = [
	"mmh3>=4.0",
]

[project.scripts]
inoue = "inoue:app"
inoue-mcp = "mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["inoue", "mcp_server"]

[tool.setuptools.packages.find]
include = ["core*", "fingerprints*", "api*", "data*"]

[tool.setuptools.package-data]
data = ["cves.json"]

[tool.poetry.dependencies]
httpx = ">=0.27"
rich = ">=13"
typer = ">=0.12"
dnspython = ">=2.6"
python-whois = ">=0.8"
requests = ">=2.31"
beautifulsoup4 = ">=4.12"
sslyze = ">=6.0.0"
python-nmap = ">=0.7.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
